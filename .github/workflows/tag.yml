name: Tag

on:
  push:
    branches: [main]

permissions: {}

jobs:
  tag:
    name: Tag
    uses: praxi-labs/ci/.github/workflows/auto-tag.yml@v1
    with:
      version-path: package.json
    permissions:
      contents: write

  publish:
    name: Publish
    needs: tag
    if: needs.tag.outputs.tagged == 'true'
    uses: praxi-labs/ci/.github/workflows/chrome-publish.yml@v1
    with:
      release-tag: v${{ needs.tag.outputs.version }}
    permissions:
      contents: write
    secrets:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
